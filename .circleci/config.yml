version: 2.1

orbs:
  node: circleci/node@5.1.0
  aws-cli: circleci/aws-cli@5.3.2

commands:
  store-version:
    description: "Extract version number from release tag and feature branch name"
    steps:
      - run:
          name: Store version
          command: |
            # Extract version from tag
            if [[ $CIRCLE_TAG =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "export VERSION=${BASH_REMATCH[1]}-SNAPSHOT" >> $BASH_ENV
              source $BASH_ENV
              echo "Version set to: $VERSION"
            elif [[ $CIRCLE_BRANCH =~ ^feature/(.+)$ ]]; then
              echo "export BRANCH_NAME=${BASH_REMATCH[1]}-SNAPSHOT" >> $BASH_ENV
              source $BASH_ENV
              echo "Branch name set to: $BRANCH_NAME"
            else
              echo "Invalid tag or branch name format. Expected release/x.x.x or feature/x.x.x"
              exit 1
            fi

  deploy-to-env:
    description: "Deploy to specified environment"
    parameters:
      environment:
        type: string
        description: "Environment to deploy to (qa, staging, prod)"
    steps:
      - attach_workspace:
          at: .
      - store-version
      - aws-cli/setup:
          profile_name: realms
      - run:
          name: Configure AWS
          command: |
            aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}" --profile realms
            aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}" --profile realms
            aws configure set region "${AWS_REGION}" --profile realms
      - run:
          name: Sync to S3
          command: |
            aws s3 sync dist/ s3://realms-libs-<< parameters.environment >>/${CIRCLE_TAG:+${VERSION}}${CIRCLE_BRANCH:+${BRANCH_NAME}}/ \
              --profile realms \
              --acl public-read \
              --exclude "server.js" \
              --exclude "server.js.map" \
              --include "server.*.js" \
              --include "server.*.js.map"

jobs:
  install:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint
          command: npm run pipeline:lint

  test:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: npm run pipeline:test --detectOpenHandles

  build:
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy-qa:
    docker:
      - image: cimg/node:20.10
    environment:
      AWS_REGION: us-west-2
    steps:
      - checkout
      - deploy-to-env:
          environment: qa

  deploy-staging:
    docker:
      - image: cimg/node:20.10
    environment:
      AWS_REGION: us-west-2
    steps:
      - checkout
      - deploy-to-env:
          environment: staging

  deploy-prod:
    docker:
      - image: cimg/node:20.10
    environment:
      AWS_REGION: us-west-2
    steps:
      - checkout
      - deploy-to-env:
          environment: prod

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - lint
            - test
      - deploy-qa:
          requires:
            - build
          filters:
            branches:
              only:
                - /^feature\/.*/
          context: Realms
      - deploy-staging:
          requires:
            - build
          filters:
            tags:
              only: /^release\/.*/
            branches:
              ignore: /.*/
          context: Realms
      - deploy-prod:
          requires:
            - build
          filters:
            tags:
              only: /^release\/.*/
            branches:
              ignore: /.*/
          context: Realms 
